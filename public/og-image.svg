<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="#0066cc" rx="2"/>

  <!-- Name -->
  <text x="112" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="72" font-weight="800" letter-spacing="-3" fill="#1d1d1f">Naren S J</text>

  <!-- Title -->
  <text x="112" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="32" font-weight="500" fill="#86868b">AI Engineer &amp; Software Builder</text>

  <!-- Divider -->
  <line x1="112" y1="290" x2="700" y2="290" stroke="#d2d2d7" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="112" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="26" font-weight="400" fill="#515154">
    Building intelligent systems at the intersection of
  </text>
  <text x="112" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="26" font-weight="400" fill="#515154">
    AI, high-performance C++, and full-stack engineering.
  </text>

  <!-- Skill pills -->
  <rect x="112" y="440" width="120" height="36" rx="18" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/>
  <text x="172" y="463" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">RAG / AI</text>

  <rect x="248" y="440" width="100" height="36" rx="18" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/>
  <text x="298" y="463" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">C++ / Epoll</text>

  <rect x="364" y="440" width="130" height="36" rx="18" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/>
  <text x="429" y="463" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">Next.js / React</text>

  <rect x="510" y="440" width="130" height="36" rx="18" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/>
  <text x="575" y="463" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">TypeScript</text>

  <rect x="656" y="440" width="130" height="36" rx="18" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/>
  <text x="721" y="463" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">PostgreSQL</text>

  <!-- Domain -->
  <text x="112" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="20" font-weight="600" fill="#0066cc">narensj.netlify.app</text>

  <!-- Right accent circle -->
  <circle cx="1060" cy="315" r="180" fill="#f5f5f7"/>
  <circle cx="1060" cy="315" r="140" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
  <text x="1060" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="48" font-weight="800" fill="#1d1d1f" text-anchor="middle">NSJ</text>
  <text x="1060" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" font-weight="500" fill="#86868b" text-anchor="middle">Portfolio 2026</text>
